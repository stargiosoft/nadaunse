<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PortOne SDK Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
    button { padding: 15px 30px; font-size: 18px; margin: 10px 0; width: 100%; cursor: pointer; border: 2px solid #333; border-radius: 8px; background: #fff; }
    button:active { background: #eee; }
    #log { background: #f5f5f5; padding: 15px; border-radius: 8px; font-size: 13px; white-space: pre-wrap; word-break: break-all; margin-top: 20px; max-height: 400px; overflow-y: auto; }
    .success { color: green; }
    .error { color: red; }
    .info { color: blue; }
  </style>
</head>
<body>
  <h2>PortOne SDK Direct Test</h2>
  <p>React/PaymentNew.tsx 우회 - SDK만 직접 테스트</p>

  <button onclick="testCard()">카드 결제 (다날) - 100원</button>
  <button onclick="testKakaoPay()">카카오페이 - 100원</button>
  <button onclick="testCardPopup()">카드 (popup:true) - 100원</button>
  <button onclick="testCardNoPopup()">카드 (popup:false) - 100원</button>

  <div id="log"></div>

  <script src="https://cdn.iamport.kr/v1/iamport.js"></script>
  <script>
    var logEl = document.getElementById('log');

    function log(msg, type) {
      var time = new Date().toLocaleTimeString();
      var line = document.createElement('div');
      line.className = type || '';
      line.textContent = '[' + time + '] ' + msg;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
      console.log(msg);
    }

    // SDK 초기화
    log('SDK 로딩 상태: ' + (window.IMP ? 'OK' : 'FAIL'), window.IMP ? 'success' : 'error');

    if (window.IMP) {
      window.IMP.init('imp38022226');
      log('IMP.init 완료 (imp38022226)', 'success');
      log('SDK version: ' + (IMP.version || 'unknown'), 'info');
    } else {
      log('IMP 객체가 없습니다! SDK 로딩 실패', 'error');
    }

    function doPayment(params) {
      log('결제 요청 시작: ' + JSON.stringify(params), 'info');

      window.IMP.request_pay(params, function(response) {
        log('콜백 수신!', 'info');
        if (response.success) {
          log('결제 성공: ' + response.imp_uid, 'success');
        } else {
          log('결제 실패: ' + response.error_msg, 'error');
        }
        log('전체 응답: ' + JSON.stringify(response));
      });

      log('request_pay 호출 완료 (콜백 대기중...)', 'info');
    }

    function testCard() {
      doPayment({
        pg: 'danal_tpay.A010076393',
        pay_method: 'card',
        merchant_uid: 'test_' + Date.now(),
        name: 'SDK 테스트 (카드)',
        amount: 100,
        buyer_name: '테스트',
        buyer_tel: '010-0000-0000',
        digital: true,
        m_redirect_url: window.location.href
      });
    }

    function testKakaoPay() {
      doPayment({
        pg: 'kakaopay.CAAHYG5DKD',
        pay_method: 'card',
        merchant_uid: 'test_' + Date.now(),
        name: 'SDK 테스트 (카카오페이)',
        amount: 100,
        buyer_name: '테스트',
        buyer_tel: '010-0000-0000',
        m_redirect_url: window.location.href
      });
    }

    function testCardPopup() {
      doPayment({
        pg: 'danal_tpay.A010076393',
        pay_method: 'card',
        merchant_uid: 'test_' + Date.now(),
        name: 'SDK 테스트 (카드 popup:true)',
        amount: 100,
        buyer_name: '테스트',
        buyer_tel: '010-0000-0000',
        digital: true,
        popup: true,
        m_redirect_url: window.location.href
      });
    }

    function testCardNoPopup() {
      doPayment({
        pg: 'danal_tpay.A010076393',
        pay_method: 'card',
        merchant_uid: 'test_' + Date.now(),
        name: 'SDK 테스트 (카드 popup:false)',
        amount: 100,
        buyer_name: '테스트',
        buyer_tel: '010-0000-0000',
        digital: true,
        popup: false,
        m_redirect_url: window.location.href
      });
    }
  </script>
</body>
</html>
